name: Build Windows Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --dart-define=APP_RELEASE_VERSION=${{ github.event.release.tag_name }}

      - name: Normalize tag/version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag.TrimStart('v')
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Zip Windows build
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $zipName = "8answers_${tag}-windows.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          New-Item -Path "windows/installer/deps" -ItemType Directory -Force | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows/installer/deps/vc_redist.x64.exe"

      - name: Build Windows installer (.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $setupName = "8answers_v${{ env.RELEASE_VERSION }}-windows-setup.exe"
          & $iscc `
            "/DAppVersion=${{ env.RELEASE_VERSION }}" `
            "/DSourcePath=$pwd\build\windows\x64\runner\Release" `
            "/DVCRedistPath=$pwd\windows\installer\deps\vc_redist.x64.exe" `
            "/DOutputDir=$pwd" `
            "windows\installer\8answers_installer.iss"
          if (!(Test-Path $setupName)) { throw "Installer not generated: $setupName" }
          echo "SETUP_NAME=$setupName" >> $env:GITHUB_ENV

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.SETUP_NAME }}
