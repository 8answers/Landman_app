name: Build and Sign Windows Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TIMESTAMP_URL: http://timestamp.digicert.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --dart-define=APP_RELEASE_VERSION=${{ github.event.release.tag_name }}

      - name: Normalize tag/version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag.TrimStart('v')
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore code signing certificate
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64)) {
            throw "Missing repository secret WINDOWS_CERT_PFX_BASE64 (base64 encoded .pfx file)."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "windows-codesign.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          if (!(Test-Path $certPath)) {
            throw "Failed to restore the code-signing certificate."
          }
          "CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($signTool)) {
            throw "signtool.exe not found on the runner."
          }
          "SIGNTOOL_PATH=$signTool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using SignTool: $signTool"

      - name: Sign Windows binaries
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            throw "Missing repository secret WINDOWS_CERT_PASSWORD."
          }
          $releaseDir = "build/windows/x64/runner/Release"
          if (!(Test-Path $releaseDir)) {
            throw "Release directory not found: $releaseDir"
          }
          $targets = Get-ChildItem $releaseDir -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") }
          if ($targets.Count -eq 0) {
            throw "No .exe or .dll files found to sign in $releaseDir"
          }
          foreach ($target in $targets) {
            & $env:SIGNTOOL_PATH sign /v /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 `
              /f $env:CERT_PATH /p $env:WINDOWS_CERT_PASSWORD $target.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($target.FullName)"
            }
          }

      - name: Verify Windows binary signatures
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $targets = Get-ChildItem $releaseDir -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") }
          foreach ($target in $targets) {
            & $env:SIGNTOOL_PATH verify /pa /v $target.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $($target.FullName)"
            }
          }

      - name: Zip Windows build
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $zipName = "8answers_${tag}-windows.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          New-Item -Path "windows/installer/deps" -ItemType Directory -Force | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows/installer/deps/vc_redist.x64.exe"

      - name: Build Windows installer (.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $setupName = "8answers_v${{ env.RELEASE_VERSION }}-windows-setup.exe"
          & $iscc `
            "/DAppVersion=${{ env.RELEASE_VERSION }}" `
            "/DSourcePath=$pwd\build\windows\x64\runner\Release" `
            "/DVCRedistPath=$pwd\windows\installer\deps\vc_redist.x64.exe" `
            "/DOutputDir=$pwd" `
            "windows\installer\8answers_installer.iss"
          if (!(Test-Path $setupName)) { throw "Installer not generated: $setupName" }
          echo "SETUP_NAME=$setupName" >> $env:GITHUB_ENV

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            throw "Missing repository secret WINDOWS_CERT_PASSWORD."
          }
          $setupName = "${{ env.SETUP_NAME }}"
          if (!(Test-Path $setupName)) {
            throw "Installer not found: $setupName"
          }
          & $env:SIGNTOOL_PATH sign /v /fd SHA256 /tr $env:TIMESTAMP_URL /td SHA256 `
            /f $env:CERT_PATH /p $env:WINDOWS_CERT_PASSWORD $setupName
          if ($LASTEXITCODE -ne 0) {
            throw "Signing failed for installer: $setupName"
          }

      - name: Verify installer signature
        shell: pwsh
        run: |
          $setupName = "${{ env.SETUP_NAME }}"
          & $env:SIGNTOOL_PATH verify /pa /v $setupName
          if ($LASTEXITCODE -ne 0) {
            throw "Signature verification failed for installer: $setupName"
          }

      - name: Remove certificate from runner
        if: ${{ always() }}
        shell: pwsh
        run: |
          if ($env:CERT_PATH -and (Test-Path $env:CERT_PATH)) {
            Remove-Item $env:CERT_PATH -Force
          }

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.SETUP_NAME }}
