<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitation Accepted | 8Answers</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
        padding: 80px 20px;
        background-color: #f4f7f9;
        color: #1a1a1a;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
      }

      .card {
        max-width: 480px;
        width: 100%;
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        text-align: center;
      }

      .logo-img {
        height: 40px;
        width: auto;
        margin: 0 auto 30px auto;
        display: block;
      }

      h3 {
        font-size: 24px;
        font-weight: 800;
        color: #000;
        margin: 0 0 16px 0;
        letter-spacing: -0.5px;
      }

      .instruction {
        font-size: 16px;
        color: #475569;
        line-height: 1.6;
        margin-bottom: 24px;
      }

      .success-badge {
        display: inline-block;
        background-color: #ecfdf5;
        color: #10b981;
        padding: 6px 16px;
        border-radius: 100px;
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .action-steps {
        background-color: #f8fafc;
        padding: 24px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        display: inline-block;
        width: 100%;
        box-sizing: border-box;
      }

      .step-text {
        font-size: 15px;
        color: #1e293b;
        margin: 0;
        font-weight: 600;
        display: block;
      }

      .help {
        font-size: 13px;
        color: #888;
        margin-top: 32px;
        border-top: 1px solid #eee;
        padding-top: 24px;
        line-height: 1.5;
      }

      .link {
        color: #0c8ce9;
        text-decoration: none;
        font-weight: 600;
      }

      .loader {
        width: 40px;
        height: 40px;
        margin: 0 auto 24px auto;
        border: 4px solid #e2e8f0;
        border-top-color: #0c8ce9;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      .error-badge {
        display: inline-block;
        background-color: #fef2f2;
        color: #dc2626;
        padding: 6px 16px;
        border-radius: 100px;
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .button-link {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 8px;
        background-color: #0c8ce9;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
        margin-top: 10px;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card" id="invite-card">
      <img
        src="https://xljsafhmsncothpsbfpp.supabase.co/storage/v1/object/public/email_image/email_icon_8answerspng.png"
        alt="8Answers"
        class="logo-img"
      />
      <div class="loader"></div>
      <h3>Checking Invitation</h3>
      <p class="instruction">
        We’re confirming your 8Answers project access.
      </p>
    </div>

    <script>
      (() => {
        const FUNCTION_URL =
          "https://xljsafhmsncothpsbfpp.supabase.co/functions/v1/resolve-project-invite";
        const FALLBACK_URL = `${window.location.origin}/`;
        const SIGNIN_URL = `${window.location.origin}/`;
        const inviteStorageKey = "landman_invite_context";

        const params = new URLSearchParams(window.location.search || "");
        const inviteToken =
          (params.get("inv") || params.get("inviteToken") || params.get("pathToken") || "").trim();
        const projectId = (params.get("projectId") || "").trim();
        const projectRole = (params.get("projectRole") || "").trim();
        const projectName = (params.get("projectName") || "").trim();
        const ownerEmail = (params.get("ownerEmail") || "").trim();
        const invitedEmail = (params.get("invitedEmail") || "").trim().toLowerCase();
        const card = document.getElementById("invite-card");

        const escapeHtml = (value) =>
          String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");

        const renderSuccess = () => {
          if (!card) return;
          card.innerHTML = `
            <img src="https://xljsafhmsncothpsbfpp.supabase.co/storage/v1/object/public/email_image/email_icon_8answerspng.png" alt="8Answers" class="logo-img">
            <div class="success-badge">Access Confirmed</div>
            <h3>Invitation Accepted</h3>
            <p class="instruction">
              Your account is now linked to the project. Please follow the steps below to start working.
            </p>
            <div class="action-steps">
              <span class="step-text">1. Open the 8Answers Desktop App</span>
              <div style="height: 12px;"></div>
              <span class="step-text">2. Check "Recent Projects" or "All Projects"</span>
            </div>
            <p style="font-size: 14px; color: #64748b; margin-top: 25px;">
              If the project doesn't appear immediately, please <br><strong>Refresh</strong> the page within the app.
            </p>
            <div class="help">
              <strong>Having trouble?</strong><br>
              Contact us at <a href="mailto:connect@8answers.com" class="link">connect@8answers.com</a>
            </div>
          `;
        };

        const renderAccountRequired = () => {
          if (!card) return;
          const signinParams = new URLSearchParams({
            invite: "1",
            projectId,
            projectRole: projectRole || "partner",
            invitedEmail,
          });
          if (inviteToken) signinParams.set("inv", inviteToken);
          if (projectName) signinParams.set("projectName", projectName);
          if (ownerEmail) signinParams.set("ownerEmail", ownerEmail);
          const signinHref = `${SIGNIN_URL}?${signinParams.toString()}`;

          card.innerHTML = `
            <img src="https://xljsafhmsncothpsbfpp.supabase.co/storage/v1/object/public/email_image/email_icon_8answerspng.png" alt="8Answers" class="logo-img">
            <div class="error-badge" style="background-color:#fff7ed;color:#c2410c;">Action Required</div>
            <h3>Finish Sign-In To Accept</h3>
            <p class="instruction">
              We couldn't find an 8Answers account for <strong>${escapeHtml(invitedEmail)}</strong>.
              Sign in or create an account with this same email, then the invite will be linked.
            </p>
            <a href="${signinHref}" class="button-link">Continue to Sign In</a>
            <div class="help">
              <strong>Need help?</strong><br>
              Contact us at <a href="mailto:connect@8answers.com" class="link">connect@8answers.com</a>
            </div>
          `;
        };

        const renderError = (message) => {
          if (!card) return;
          card.innerHTML = `
            <img src="https://xljsafhmsncothpsbfpp.supabase.co/storage/v1/object/public/email_image/email_icon_8answerspng.png" alt="8Answers" class="logo-img">
            <div class="error-badge">Invite Error</div>
            <h3>We Couldn’t Confirm This Invitation</h3>
            <p class="instruction">${escapeHtml(message)}</p>
            <a href="${FALLBACK_URL}" class="button-link">Go to 8Answers</a>
            <div class="help">
              <strong>Need help?</strong><br>
              Contact us at <a href="mailto:connect@8answers.com" class="link">connect@8answers.com</a>
            </div>
          `;
        };

        if (!projectId || !invitedEmail) {
          renderError("Missing invite context. Please request a new invitation.");
          return;
        }

        fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            inviteToken,
            projectId,
            projectRole,
            projectName,
            ownerEmail,
            invitedEmail,
          }),
        })
          .then(async (response) => {
            const data = await response.json().catch(() => ({}));
            if (data && data.success === true && data.hasAccount === false) {
              try {
                window.localStorage.setItem(
                  inviteStorageKey,
                  JSON.stringify({
                    projectId,
                    projectRole: data.role || projectRole || "partner",
                    ...(projectName ? { projectName } : {}),
                  }),
                );
              } catch (_) {
                // Ignore storage failures.
              }
              renderAccountRequired();
              return;
            }

            if (data && data.success === true && data.accepted === true) {
              try {
                window.localStorage.setItem(
                  inviteStorageKey,
                  JSON.stringify({
                    projectId,
                    projectRole: data.role || projectRole || "partner",
                    ...(projectName ? { projectName } : {}),
                  }),
                );
              } catch (_) {
                // Ignore storage failures.
              }
              renderSuccess();
              return;
            }

            const message =
              (data && data.error) ||
              "This invitation is no longer available. Please contact the project owner.";
            renderError(message);
          })
          .catch(() => {
            renderError(
              "We couldn’t reach the invite service right now. Please try again in a moment.",
            );
          });
      })();
    </script>
  </body>
</html>
