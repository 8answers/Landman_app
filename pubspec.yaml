name: landman_website
description: A responsive Flutter app implementing the Account Settings design
publish_to: 'none'
version: 1.7.5+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  supabase_flutter: ^2.5.6
  intl: ^0.19.0
  archive: ^3.6.1
  lottie: ^2.4.0
  universal_html: ^2.2.4
  file_selector: ^1.0.3
  app_links: ^6.4.1
  webview_flutter: ^4.10.0
  webview_windows: ^0.4.0
  cryptography: ^2.7.0
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - web/website_8answers copy 2/
    - web/website_8answers copy 2/assets/
    - web/website_8answers copy 2/assets/new-features/

  # Lottie animations
  # Add Lottie asset JSON files under assets/images/

msix_config:
  display_name: "8Answers"
  publisher_display_name: "8Answers"
  identity_name: "8Answers.8Answers"
  publisher: "CN=0A51BEC8-A75C-45AA-9833-5E93207EEAE6"
  msix_version: 1.7.4.0
  architecture: x64
  store: true
